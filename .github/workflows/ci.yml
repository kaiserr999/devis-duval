name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Style (pycodestyle)
        run: pycodestyle .

      - name: Tests (pytest)
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Construire et démarrer le conteneur
        run: docker compose up -d --build

      - name: Vérifier /api/health
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:5000/api/health; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Arrêter
        if: always()
        run: docker compose down
