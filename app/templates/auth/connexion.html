{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="connexion">
  <h1>Connexion</h1>
  <p class="sous-titre">Gérant ou client de Peinture Duval : connectez-vous avec votre email.</p>

  {% if erreur %}<p class="alerte alerte-erreur" role="alert">{{ erreur }}</p>{% endif %}

  <form class="carte" method="post" action="{{ url_for('auth.connexion') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if suivant %}<input type="hidden" name="suivant" value="{{ suivant }}">{% endif %}
    <div class="champ">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username"
             value="{{ email or '' }}" {% if not email %}autofocus{% endif %}>
    </div>
    <div class="champ">
      <label for="mot_de_passe">Mot de passe</label>
      <input id="mot_de_passe" name="mot_de_passe" type="password" required
             autocomplete="current-password" {% if email %}autofocus{% endif %}>
    </div>
    <button class="bouton" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
