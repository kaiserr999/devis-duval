{% extends "emails/_base.html" %}
{% block contenu %}
<p style="margin:0 0 20px;">
  {{ entreprise.nom }} vous invite à créer votre espace client pour
  consulter vos devis en ligne. Votre identifiant sera votre adresse email
  ({{ client.email }}). Ce lien est valable {{ jours }} jours.
</p>
<p style="margin:0;">
  <a href="{{ lien }}" style="display:inline-block; padding:12px 20px; background:#1d4e6f; color:#ffffff; text-decoration:none; border-radius:6px; font-weight:bold;">Créer mon espace client</a>
</p>
{% endblock %}
