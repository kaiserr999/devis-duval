services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Lue depuis l'environnement ou le fichier .env (obligatoire)
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY manquante, voir .env.example}
      # Optionnels : données de démo et compte du gérant au démarrage
      - SEED_DEMO=${SEED_DEMO:-0}
      - GERANT_EMAIL=${GERANT_EMAIL:-}
      - GERANT_MOT_DE_PASSE=${GERANT_MOT_DE_PASSE:-}
    volumes:
      # Volume nommé : garde la base entre deux redémarrages, avec les
      # droits de l'utilisateur non root du conteneur
      - donnees:/app/instance

volumes:
  donnees:
